[package]
name = "autumn-plugin-nats"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Autumn plugin: NATS messaging (pub/sub, request/reply, JetStream) for Autumn apps."
license = "Apache-2.0"
repository = "https://github.com/madmax983/autumn-plugin-nats"
readme = "README.md"
keywords = ["autumn", "nats", "messaging", "jetstream", "plugin"]
categories = ["web-programming", "asynchronous"]
exclude = [".github/", "docs/", "CLAUDE.md", "clippy.toml", "proptest-regressions/"]

[dependencies]
# No default features: the host app selects the Autumn features.
autumn-web = { version = ">=0.9, <0.10", default-features = false }
# No default features: the plugin enables exactly the NATS surface it uses
# (core client, TLS via ring, JetStream, KV, object store, NKey auth).
async-nats = { version = "0.50", default-features = false, features = [
    "jetstream",
    "kv",
    "object-store",
    "nkeys",
    "nuid",
    "ring",
    "server_2_10",
    "server_2_11",
    "server_2_12",
    "server_2_14",
] }
axum = { version = "0.8", default-features = false }
bytes = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "io-util"] }
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
redundant_pub_crate = "allow"
